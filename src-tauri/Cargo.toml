[package]
name = "timesh1t"
version = "4.18.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "timesh1t_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
harper-core = { version = "2.5", default-features = false }

# Same webkit2gtk version Tauri/wry already pull in on Linux (pinned to match Cargo.lock exactly,
# avoiding a second copy being resolved) — used in lib.rs to allow mic access via permission-request.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

# Ship a smaller binary: the Tauri updater re-downloads the whole bundle every release,
# so bytes here are paid on every auto-update, not just first install.
[profile.release]
codegen-units = 1
lto = true
strip = true
